{{- if .Values.webhooks.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "workbenches-operator.prefixed" (list . "allow-ingress") }}
  namespace: {{ .Values.operatorNamespace | quote }}
  labels:
    {{- include "workbenches-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "workbenches-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - {}
{{- end }}
